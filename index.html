<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/css/play.css">
  <link rel="stylesheet" href="/css/ads.css">

  <title>FISHAO - Local Server</title>
  <meta name="keywords" content="">
  <meta name="description" content="">

  <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/js-cookie/3.0.5/js.cookie.min.js"></script>
  <script type="text/javascript" src="/js/cufon.js"></script>
  <script type="text/javascript" src="/js/VAG_Rounded_Bold_700.font.js"></script>
  <script type="text/javascript" src="/js/jquery.ddslick.min.js"></script>
  <script type="text/javascript" src="/js/ads/ads.js"></script>
  <script type="text/javascript">Cufon.now();</script>
</head>

<body>
  <div id="header">
    <span class="left"></span><span class="center"></span><span class="right"></span>

    <div class="header">
      <div class="stats">
        <div class="online">
          Local server online
        </div>
      </div>

      <div class="visitforum">
        Fishao local development server<br>
        running on <a target="_blank" href="http://127.0.0.1/">127.0.0.1</a>
      </div>

      <div class="size-select" id="demoBasic">
        <select id="size-select">
          <option data-imagesrc="/img/viewport-frame.png" value="framed">Framed</option>
          <option data-imagesrc="/img/viewport-full.png" value="full">Full</option>
        </select>
      </div>
    </div>
  </div>

  <div id="frame" class="framed">
    <div id="gameSwfCanvas">
      <p>
        <a href="https://www.adobe.com/go/getflashplayer">
          <img src="https://www.adobe.com/images/shared/download_buttons/get_flash_player.gif"
            alt="Get Adobe Flash player" />
        </a>
      </p>
    </div>
  </div>

  <script type="text/javascript" src="/js/play.js"></script>
  <script type="text/javascript" src="/js/swfobject/swfobject.js"></script>
  <script type="text/javascript">
    var flashvars = {};

    flashvars.apiServerUrl = "http://127.0.0.1/";
    flashvars.serverVersion = "0.0.0";
    flashvars.gameSwfUrl = "http://127.0.0.1/Fishao.swf";
    flashvars.characterEditorSwfUrl = "http://127.0.0.1/data/swf/FlashFishaoCharacterEditor_1_0_218.swf";

    flashvars.platformName = "site";
    flashvars.platformPageType = "play";

    flashvars.language = "en";
    flashvars.isGuest = "";

    flashvars.adBlockDetected = window.canRunAds === undefined;
    flashvars.isSecureConnectionProtocol = false;

    var params = {
      bgcolor: "#03002F",
      wmode: "direct",
      menu: "true",
      quality: "high",
      allowScriptAccess: "always",
      allowFullScreenInteractive: "true",
      allowFullScreen: "true"
    };

    var attributes = { id: "gameSwf", name: "gameSwf" };

    swfobject.embedSWF(
      "http://127.0.0.1/Fishao.swf",
      "gameSwfCanvas",
      "100%",
      "100%",
      "10.1.0",
      "/js/swfobject/expressInstall.swf",
      flashvars,
      params,
      attributes
    );

    if (/*@cc_on!@*/false) {
      document.onfocusin = onFocus;
    } else {
      window.onfocus = onFocus;
    }

    function onFocus() {
      var flashEl = document.getElementById(attributes.id);
      if (flashEl && typeof flashEl.focus === "function") {
        flashEl.focus();
      }
    }
  </script>

  <!-- Video ads -->
  <div id="ads-iframe-div" class="ads-iframe" style="display:none">
    <iframe id="ads-iframe" src="about:blank" height="400px" width="500px" align="middle"></iframe>
    <div class="ads-iframe-buttons-wrapper">
      <span id="ads-iframe-button-wait" class="ads-iframe-button-wait" style="display:block">
        <span id="button-wait" class="noselect">
        </span>
      </span>
      <span id="ads-iframe-button-success" class="ads-iframe-button-success" style="display:none">
        <a id="button-success" class="noselect" href="javascript:ads_iframe_hide();">
        </a>
      </span>
      <span id="ads-iframe-button-timer" class="ads-iframe-button-timer" style="display:none">
        <a id="button-timer" class="noselect" href="javascript:ads_iframe_hide();">
        </a>
      </span>
    </div>
  </div>
  <!-- Video ads end -->

</body>

</html>
